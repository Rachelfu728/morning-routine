<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="冠軍晨間習慣" />
  <meta name="theme-color" content="#020617" />
  <title>冠軍的晨間習慣</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .ring-transition {
      transition: stroke-dashoffset 0.5s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s ease;
    }
    .neon-emerald {
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .neon-sky {
      box-shadow: 0 0 25px rgba(14, 165, 233, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
    .neon-amber {
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body class="bg-slate-950 text-white antialiased min-h-screen pb-14 selection:bg-emerald-500/30">
  <!-- Tech Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div id="glow-bg" class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-emerald-500/20 rounded-full blur-3xl transition-colors duration-500"></div>
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Mobile-First Single Column Container -->
  <div class="relative z-10 max-w-md mx-auto px-4 pt-5 space-y-5">

    <!-- 1. Compact Header + Streak -->
    <header class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-3 shadow-lg">
      <div>
        <div class="text-[11px] font-bold tracking-widest text-emerald-400 uppercase">CHAMPION MORNING</div>
        <h1 class="text-lg font-black tracking-tight text-white">冠軍的晨間習慣</h1>
      </div>
      <div class="flex items-center gap-2 bg-slate-950 border border-amber-500/40 rounded-xl px-3 py-1.5">
        <span class="text-lg">🔥</span>
        <div>
          <div class="text-[10px] text-slate-400 font-bold leading-none">連續啟動</div>
          <div class="text-sm font-black text-amber-400 leading-tight"><span id="streak-count">0</span> 天</div>
        </div>
      </div>
    </header>

    <!-- 2. Super-Prominent 10-Minute Timer Card -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl flex flex-col items-center">
      
      <!-- 2 Big Mode Switch Buttons (Mind vs Body) -->
      <div class="w-full grid grid-cols-2 gap-2.5 mb-5">
        <button
          id="tab-mind"
          onclick="switchPhase('mind')"
          class="py-3 px-3 rounded-2xl font-black text-sm border-2 transition-all flex flex-col items-center justify-center gap-0.5"
        >
          <div class="flex items-center gap-1.5">
            <span>🧘 10m 餵養心靈</span>
            <span id="check-mind" class="hidden text-xs">✅</span>
          </div>
          <span class="text-[11px] font-medium opacity-80">閱讀 · 冥想 · 音頻</span>
        </button>

        <button
          id="tab-body"
          onclick="switchPhase('body')"
          class="py-3 px-3 rounded-2xl font-black text-sm border-2 transition-all flex flex-col items-center justify-center gap-0.5"
        >
          <div class="flex items-center gap-1.5">
            <span>⚡ 10m 喚醒身體</span>
            <span id="check-body" class="hidden text-xs">✅</span>
          </div>
          <span class="text-[11px] font-medium opacity-80">伸展 · 肌力 · 高能量</span>
        </button>
      </div>

      <!-- Giant High-Contrast Countdown Dial -->
      <div class="relative w-52 h-52 flex items-center justify-center my-1">
        <svg class="w-full h-full -rotate-90" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="94" fill="none" stroke="#1e293b" stroke-width="14" />
          <circle
            id="timer-ring"
            class="ring-transition"
            cx="110"
            cy="110"
            r="94"
            fill="none"
            stroke="#10b981"
            stroke-width="14"
            stroke-linecap="round"
            stroke-dasharray="590.6"
            stroke-dashoffset="0"
          />
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="phase-label" class="text-xs font-extrabold uppercase tracking-widest text-emerald-400 mb-0.5">
            STEP 1 · 餵養心靈
          </span>
          <span id="timer-display" class="text-6xl font-black tracking-tight text-white tabular-nums">
            10:00
          </span>
          <span id="timer-status" class="text-xs font-bold text-slate-400 mt-1">
            點擊下方按鈕開始
          </span>
        </div>
      </div>

      <!-- GIANT GLOWING 10-MINUTE START BUTTON -->
      <button
        id="btn-main-timer"
        onclick="toggleTimer()"
        class="w-full mt-5 py-4 px-6 rounded-2xl font-black text-lg tracking-wide text-slate-950 bg-gradient-to-r from-emerald-400 to-teal-300 neon-emerald active:scale-[0.98] transition-all flex items-center justify-center gap-2.5"
      >
        <span id="btn-icon" class="text-xl">▶</span>
        <span id="btn-label">啟動 10 分鐘倒數</span>
      </button>

      <!-- Secondary Quick Actions -->
      <div class="w-full flex items-center justify-between gap-2 mt-3">
        <button
          onclick="resetTimer()"
          class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-800/90 hover:bg-slate-800 text-slate-300 border border-slate-700/80 transition"
        >
          ↺ 重置 10:00
        </button>
        <button
          onclick="completeCurrentPhase()"
          class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-slate-800/90 hover:bg-slate-800 text-emerald-300 border border-emerald-500/30 transition"
        >
          ✓ 直接標記完成
        </button>
      </div>
    </section>

    <!-- 3. Daily Top 5 Tasks (Clear, Large Font, High Readability) -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-3xl p-5 shadow-2xl">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-lg font-black text-white flex items-center gap-2">
          <span>🎯 今日 Top 5 任務</span>
        </h2>
        <span id="tasks-counter" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30">
          0 / 5 完成
        </span>
      </div>
      <p class="text-xs text-slate-300 font-medium mb-4">
        寫下 5 件高價值產出事項，並將<span class="text-amber-400 font-bold">最重要的一件事排在首位</span>。
      </p>

      <!-- 5 Task Inputs -->
      <div id="tasks-container" class="space-y-2.5"></div>

      <!-- Clear Tasks Link -->
      <div class="mt-3 text-right">
        <button onclick="resetTasks()" class="text-xs text-slate-400 hover:text-slate-200 underline">
          清空重置今日任務
        </button>
      </div>
    </section>

    <!-- 4. Big Finish & Share Actions -->
    <section class="space-y-2.5">
      <button
        onclick="finishMorningRoutine()"
        class="w-full py-4 px-6 rounded-2xl font-black text-base text-slate-950 bg-gradient-to-r from-amber-400 via-yellow-300 to-emerald-400 neon-amber active:scale-[0.98] transition-all flex items-center justify-center gap-2"
      >
        <span>🏆 完成今日晨間啟動打卡</span>
      </button>

      <button
        onclick="exportDailySummary()"
        class="w-full py-3.5 px-5 rounded-2xl font-bold text-sm text-white bg-slate-900 border border-slate-700 hover:border-slate-500 active:scale-[0.99] transition flex items-center justify-center gap-2"
      >
        <span>📋 一鍵複製今日清單（貼到 LINE）</span>
      </button>

      <div id="toast-msg" class="text-center text-xs font-bold text-emerald-400 h-4 opacity-0 transition-opacity duration-300">
        ✓ 已自動儲存
      </div>
    </section>

    <!-- 5. Quote Footer -->
    <footer class="p-4 rounded-2xl bg-slate-900/70 border border-slate-800 text-center">
      <p class="text-xs sm:text-sm font-bold text-slate-200 leading-relaxed">
        「想擁有高標準的事業，必須先提升個人生活的標準。<br />
        給我看你的每日習慣，我就能看出你是否具備冠軍相。」
      </p>
    </footer>

  </div>

  <script>
    const STORAGE_KEY = 'champion_morning_routine_v1';
    const RING_CIRCUMFERENCE = 2 * Math.PI * 94;

    let state = {
      date: getTodayStr(),
      currentPhase: 'mind',
      phasesDone: { mind: false, body: false },
      tasks: [
        { text: '', done: false },
        { text: '', done: false },
        { text: '', done: false },
        { text: '', done: false },
        { text: '', done: false }
      ],
      streak: 0,
      lastCheckInDate: null
    };

    let timerSeconds = 600;
    let timerTotal = 600;
    let timerInterval = null;
    let isRunning = false;

    function getTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const today = getTodayStr();
          state.streak = parsed.streak || 0;
          state.lastCheckInDate = parsed.lastCheckInDate || null;

          if (parsed.date === today) {
            state.phasesDone = parsed.phasesDone || { mind: false, body: false };
            if (Array.isArray(parsed.tasks) && parsed.tasks.length === 5) {
              state.tasks = parsed.tasks;
            }
          }
        }
      } catch (e) {}
    }

    function saveState(msg = '✓ 已自動儲存') {
      try {
        state.date = getTodayStr();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (msg) showToast(msg);
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      if (!toast) return;
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.14);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.5);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.5);
        });
      } catch (e) {}
    }

    function switchPhase(phase) {
      pauseTimer();
      state.currentPhase = phase;
      timerSeconds = 600;
      timerTotal = 600;
      renderAll();
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        isRunning = true;
        updateTimerUI();
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerUI();
          } else {
            completeCurrentPhase();
          }
        }, 1000);
      }
    }

    function pauseTimer() {
      isRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      updateTimerUI();
    }

    function resetTimer() {
      pauseTimer();
      timerSeconds = 600;
      timerTotal = 600;
      updateTimerUI();
    }

    function completeCurrentPhase() {
      pauseTimer();
      state.phasesDone[state.currentPhase] = true;
      playChime();
      saveState('🎉 完成 10 分鐘專注！');

      if (state.currentPhase === 'mind' && !state.phasesDone.body) {
        switchPhase('body');
      } else {
        renderAll();
      }
    }

    function updateTimerUI() {
      const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = `${mins}:${secs}`;

      const isMind = state.currentPhase === 'mind';
      const ring = document.getElementById('timer-ring');
      const progress = timerTotal > 0 ? (timerTotal - timerSeconds) / timerTotal : 0;
      ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1 - progress);
      ring.style.stroke = isMind ? '#10b981' : '#0ea5e9';

      const phaseLabel = document.getElementById('phase-label');
      phaseLabel.textContent = isMind ? 'STEP 1 · 餵養心靈' : 'STEP 2 · 喚醒身體';
      phaseLabel.className = `text-xs font-extrabold uppercase tracking-widest mb-0.5 ${
        isMind ? 'text-emerald-400' : 'text-sky-400'
      }`;

      const glowBg = document.getElementById('glow-bg');
      glowBg.className = `absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 rounded-full blur-3xl transition-colors duration-500 ${
        isMind ? 'bg-emerald-500/20' : 'bg-sky-500/20'
      }`;

      const btn = document.getElementById('btn-main-timer');
      const icon = document.getElementById('btn-icon');
      const label = document.getElementById('btn-label');
      const status = document.getElementById('timer-status');

      if (isRunning) {
        icon.textContent = '⏸';
        label.textContent = '暫停 10 分鐘計時';
        status.textContent = '🔥 專注計時進行中...';
        btn.className = 'w-full mt-5 py-4 px-6 rounded-2xl font-black text-lg tracking-wide text-white bg-rose-600 shadow-lg shadow-rose-600/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2.5';
      } else {
        icon.textContent = '▶';
        const phaseName = isMind ? '餵養心靈' : '喚醒身體';
        label.textContent = timerSeconds < timerTotal ? `繼續 10 分鐘 (${phaseName})` : `啟動 10 分鐘 · ${phaseName}`;
        status.textContent = state.phasesDone[state.currentPhase] ? '✅ 此階段今日已完成' : '點擊下方大按鈕開始計時';
        btn.className = isMind
          ? 'w-full mt-5 py-4 px-6 rounded-2xl font-black text-lg tracking-wide text-slate-950 bg-gradient-to-r from-emerald-400 to-teal-300 neon-emerald active:scale-[0.98] transition-all flex items-center justify-center gap-2.5'
          : 'w-full mt-5 py-4 px-6 rounded-2xl font-black text-lg tracking-wide text-slate-950 bg-gradient-to-r from-sky-400 to-cyan-300 neon-sky active:scale-[0.98] transition-all flex items-center justify-center gap-2.5';
      }
    }

    function renderTabs() {
      const isMind = state.currentPhase === 'mind';
      const tabMind = document.getElementById('tab-mind');
      const tabBody = document.getElementById('tab-body');

      tabMind.className = isMind
        ? 'py-3 px-3 rounded-2xl font-black text-sm border-2 border-emerald-400 bg-emerald-500/20 text-white shadow-lg shadow-emerald-500/10 transition-all flex flex-col items-center justify-center gap-0.5'
        : 'py-3 px-3 rounded-2xl font-bold text-sm border border-slate-800 bg-slate-950/60 text-slate-400 transition-all flex flex-col items-center justify-center gap-0.5';

      tabBody.className = !isMind
        ? 'py-3 px-3 rounded-2xl font-black text-sm border-2 border-sky-400 bg-sky-500/20 text-white shadow-lg shadow-sky-500/10 transition-all flex flex-col items-center justify-center gap-0.5'
        : 'py-3 px-3 rounded-2xl font-bold text-sm border border-slate-800 bg-slate-950/60 text-slate-400 transition-all flex flex-col items-center justify-center gap-0.5';

      document.getElementById('check-mind').className = state.phasesDone.mind ? 'inline text-xs' : 'hidden';
      document.getElementById('check-body').className = state.phasesDone.body ? 'inline text-xs' : 'hidden';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      container.innerHTML = state.tasks
        .map((task, idx) => {
          const isMIT = idx === 0;
          return `
          <div class="flex items-center gap-2.5 p-3.5 rounded-2xl border-2 transition ${
            isMIT
              ? 'bg-amber-500/15 border-amber-400/80 shadow-md'
              : 'bg-slate-950/90 border-slate-800'
          }">
            <button
              onclick="toggleTaskDone(${idx})"
              class="w-7 h-7 rounded-xl border-2 flex items-center justify-center transition shrink-0 text-sm font-black ${
                task.done
                  ? 'bg-emerald-400 border-emerald-400 text-slate-950'
                  : isMIT
                  ? 'border-amber-400 text-transparent'
                  : 'border-slate-600 text-transparent'
              }"
            >
              ✓
            </button>

            <span class="shrink-0 text-xs font-black px-2 py-1 rounded-lg ${
              isMIT ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-300'
            }">
              ${isMIT ? '👑 #1 最重要' : `#${idx + 1}`}
            </span>

            <input
              type="text"
              value="${escapeHtml(task.text)}"
              oninput="updateTaskText(${idx}, this.value)"
              placeholder="${isMIT ? '今日最重要的一件事...' : `第 ${idx + 1} 項高價值任務...`}"
              class="w-full bg-transparent text-base font-bold ${
                task.done ? 'line-through text-slate-500' : 'text-white'
              } placeholder-slate-500 focus:outline-none"
            />

            ${
              !isMIT
                ? `<button
                    onclick="promoteToTop(${idx})"
                    class="shrink-0 px-2.5 py-1.5 rounded-xl text-xs font-extrabold bg-slate-800 active:bg-amber-400 active:text-slate-950 text-amber-300 border border-slate-700"
                  >
                    ↑置頂
                  </button>`
                : ''
            }
          </div>
        `;
        })
        .join('');

      const doneCount = state.tasks.filter(t => t.done).length;
      document.getElementById('tasks-counter').textContent = `${doneCount} / 5 完成`;
    }

    function updateTaskText(idx, val) {
      state.tasks[idx].text = val;
      saveState();
    }

    function toggleTaskDone(idx) {
      state.tasks[idx].done = !state.tasks[idx].done;
      saveState();
      renderTasks();
    }

    function promoteToTop(idx) {
      if (idx <= 0) return;
      const [item] = state.tasks.splice(idx, 1);
      state.tasks.unshift(item);
      saveState('👑 已排在首位 (#1 最重要事項)');
      renderTasks();
    }

    function resetTasks() {
      state.tasks = [
        { text: '', done: false },
        { text: '', done: false },
        { text: '', done: false },
        { text: '', done: false },
        { text: '', done: false }
      ];
      saveState('已清空今日任務');
      renderTasks();
    }

    function finishMorningRoutine() {
      const today = getTodayStr();
      state.phasesDone.mind = true;
      state.phasesDone.body = true;
      if (state.lastCheckInDate !== today) {
        state.streak = (state.streak || 0) + 1;
        state.lastCheckInDate = today;
      }
      playChime();
      saveState('🏆 今日晨間啟動打卡成功！');
      renderAll();
    }

    function exportDailySummary() {
      const lines = [
        `🏆 【冠軍晨間習慣 — ${state.date}】`,
        `🧘 10m 餵養心靈：${state.phasesDone.mind ? '✅ 已完成' : '⬜'}`,
        `⚡ 10m 喚醒身體：${state.phasesDone.body ? '✅ 已完成' : '⬜'}`,
        `🎯 今日 Top 5 高價值任務：`,
        ...state.tasks.map((t, i) => `${i === 0 ? '👑 #1 [最重要]' : `   #${i + 1}`} ${t.text || '(未填寫)'} ${t.done ? '✅' : ''}`)
      ];
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        showToast('📋 已複製今日清單！可直接貼到 LINE');
      });
    }

    function renderAll() {
      document.getElementById('streak-count').textContent = state.streak;
      renderTabs();
      updateTimerUI();
      renderTasks();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
